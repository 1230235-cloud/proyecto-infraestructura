apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cansat-web-ingress
  namespace: cansat-infra
  annotations:
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
spec:
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: cansat-web-svc
                port:
                  number: 80
