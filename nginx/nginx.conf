events {}

http {
    upstream cansat_backend {
        least_conn;
        server cansat-web-1:8000;
        server cansat-web-2:8000;
        server cansat-web-3:8000;
    }

    server {
        listen 80;
        server_name _;

        location /events {
            proxy_pass http://cansat_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 3600s;
        }

        location / {
            proxy_pass http://cansat_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            add_header X-Served-By "nginx-cansat-lb" always;
        }
    }
}
